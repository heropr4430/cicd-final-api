name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t ghcr.io/heropr4430/final-api:${GITHUB_SHA::7} .

      - name: Log in to GHRC
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: docker push ghcr.io/heropr4430/final-api:${GITHUB_SHA::7}
  
  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      packages: read
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy staging
        run: |
          cd ~/staging
          sed -i "s/^API_TAG=.*/API_TAG=${GITHUB_SHA::7}/" .env
          docker compose pull api
          docker compose up -d
          sleep 15
          curl -fsS localhost:8082/api/health
